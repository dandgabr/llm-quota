# llm-quota edge ingress — nginx with TLS 1.3 + HTTP/3 (QUIC) + QUERY allow-list.
# Engine-agnostic; works under docker-compose or podman-compose. In production
# replace the self-signed cert files with a real CA cert (e.g. ACME) and set the
# same paths in .env. HTTP/3 needs UDP 443/8443 + ALPN h3; clients fall back to
# h2/h1.1 gracefully (ADR-008).

events {
  worker_connections 1024;
}

http {
  # Per-IP rate limiting for the public auth surface (brute-force defense).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream api_upstream {
    server api:3000;
  }

  server {
    listen 443 ssl http2;
    # HTTP/3 (QUIC) on the same listener (nginx 1.25+):
    listen 443 quic reuseport;
    http3 on;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header Alt-Svc 'h3=":443"; ma=86400, quic=":443"; ma=86400; persist=1';

    server_name _;

    # TLS 1.3-only policy (ADR-008): no CBC suites, no TLS 1.2 downgrade path.
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_certificate /etc/llm-quota/tls/fullchain.pem;
    ssl_certificate_key /etc/llm-quota/tls/privkey.pem;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Allow the QUERY method (RFC 10008) so complex history reads work.
      limit_except GET HEAD POST PUT PATCH DELETE OPTIONS QUERY {
        deny all;
      }
    }

    # Public auth surface: strict per-IP throttle (app-layer limiter is the
    # second line of defense).
    location /auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the web SPA direct.
    location /app/ {
      proxy_pass http://web:80/;
    }
  }

  # Plain-HTTP redirect (optional; production should terminate TLS here).
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }
}
