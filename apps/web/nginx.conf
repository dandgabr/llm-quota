# llm-quota web — nginx serving the SPA and proxying /v1 to the api service.
# The edge ingress (separate Caddy/nginx) handles TLS 1.3 + HTTP/3 + the QUERY
# method allow-list (ADR-008).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: serve index.html for client routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the api service over the compose network.
  location /v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Security headers (CSP etc. are reinforced at the edge on TLS).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
