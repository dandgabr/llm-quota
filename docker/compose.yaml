# llm-quota — docker-compose (engine-agnostic: Docker OR Podman).
# Both `docker compose` and `podman-compose` read this file.
#
# Services:
#   postgres — dedicated Postgres (internal network only)
#   api      — Hono REST API + collector (Node 22), connects as `llmquota_app`
#              (non-superuser) so FORCE RLS tenant isolation is enforced
#   web      — nginx serving the Vue SPA (published on loopback only)
#   edge     — OPTIONAL (profile "edge"): TLS 1.3 + HTTP/3 + rate limiting
#
# Profiles:
#   --profile edge  adds the TLS edge (443/80, certs from ./certs)
#   --profile ops   publishes Postgres on 127.0.0.1 only, for migrate/seed
#
# Secrets are supplied via env (docker/.env or the shell); never committed.

name: llm-quota

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmquota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-llm_quota}
      # App role password (non-superuser pool identity; set by init script).
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Idempotent first-boot provisioning: creates llmquota_app with the
      # env-provided password (runs only on an empty data volume).
      - ./pg/init-prod.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmquota} -d ${POSTGRES_DB:-llm_quota}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Non-superuser pool identity: FORCE RLS applies (tenant isolation).
      DATABASE_URL: postgres://llmquota_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_quota}
      LLM_QUOTA_KEK: ${LLM_QUOTA_KEK:?set LLM_QUOTA_KEK (base64 32 bytes)}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (>=32 chars)}
      # Auth hardening peppers (required in production; fail-closed otherwise).
      AUTH_PEPPER: ${AUTH_PEPPER:?set AUTH_PEPPER (>=32 chars)}
      RECOVERY_PEPPER: ${RECOVERY_PEPPER:?set RECOVERY_PEPPER (>=32 chars)}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-1800}
      STEP_UP_TTL_SECONDS: ${STEP_UP_TTL_SECONDS:-300}
      LOCKOUT_IP_THRESHOLD: ${LOCKOUT_IP_THRESHOLD:-5}
      LOCKOUT_WINDOW_SECONDS: ${LOCKOUT_WINDOW_SECONDS:-900}
      LOCKOUT_BASE_SECONDS: ${LOCKOUT_BASE_SECONDS:-30}
      LOCKOUT_MAX_SECONDS: ${LOCKOUT_MAX_SECONDS:-3600}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost}
      COLLECT_INTERVAL_MS: ${COLLECT_INTERVAL_MS:-60000}
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-10}
      ENABLE_DEV_SESSION: ${ENABLE_DEV_SESSION:-}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://localhost}
    restart: unless-stopped
    # Loopback only: browsers must reach the SPA through the TLS edge (or an
    # external ingress). Use --profile edge for the bundled nginx TLS edge.
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
    depends_on:
      - api
    networks: [internal]

  edge:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/nginx.conf:ro,z
      - ../certs:/etc/llm-quota/tls:ro,z
    depends_on:
      - api
      - web
    networks: [internal]

  # Admin/ops access to Postgres (migrate, seed, backup checks) from the host.
  # Loopback only; never expose this beyond 127.0.0.1.
  postgres-ops-port:
    image: alpine:3.20
    profiles: ["ops"]
    restart: unless-stopped
    command: ["socat", "TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      - "127.0.0.1:${POSTGRES_OPS_PORT:-15432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-llm-quota}_pgdata

networks:
  internal:
